name: PeTTa library tests
on:
  push:
    branches: [main, petta-main, experiment/latest-petta]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog with Janus
        run: |
          sudo apt-add-repository ppa:swi-prolog/devel -y
          sudo apt-get update
          sudo apt-get install -y swi-prolog python3-venv
      - name: Set up tested PeTTa and scoring dependencies
        run: |
          sh setup.sh
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify external consumers and existing regressions
        run: |
          . .venv/bin/activate
          python3 scripts/test-library.py --petta scripts/run-petta.sh
          python3 scripts/run-tests.py --petta scripts/run-petta.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test-results/
